org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# ── Kotlin / Gradle Windows fix ────────────────────────────────────────
# Disables Kotlin incremental compilation — prevents "Storage already
# registered" cache corruption that occurs on Windows with deep project paths.
# Trade-off: first build is ~30s slower; subsequent builds unaffected.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Keep daemon alive; give it enough heap
org.gradle.daemon=true
kotlin.daemon.jvm.options=-Xmx1500m

# Parallel + caching for faster builds
org.gradle.parallel=true
org.gradle.caching=true
