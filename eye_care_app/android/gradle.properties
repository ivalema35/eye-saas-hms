# 2026-10-17: crashed again ("Chunk::new" native OOM) — Windows commit limit was
# ~97% used (VS Code alone had ~14GB committed), so shrunk the daemon further
# (2G -> 1536m heap, 1G -> 512m metaspace, 256m -> 128m code cache, Kotlin
# daemon 1G -> 768m). Closing extra VS Code windows/Chrome tabs helps most.
# Lowered from -Xmx4G (2026-10-03) — a release build (Gradle daemon + Kotlin
# daemon + R8/minify, all concurrent) was hitting a native OOM crash
# (hs_err_pid*.log: "Native memory allocation (mmap) failed") on this 15G-RAM
# machine once Android Studio and friends were also open. A smaller declared
# max footprint here lowers the system's overall commit charge so a G1 heap
# expansion request doesn't fail outright; if builds still crash, close other
# heavy apps (Android Studio, browser, emulator) before building, or run
# `gradlew --stop` first to clear any leftover daemon still holding memory.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# ── Kotlin / Gradle Windows fix ────────────────────────────────────────
# Disables Kotlin incremental compilation — prevents "Storage already
# registered" cache corruption that occurs on Windows with deep project paths.
# Trade-off: first build is ~30s slower; subsequent builds unaffected.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Keep daemon alive; give it enough heap
org.gradle.daemon=true
kotlin.daemon.jvm.options=-Xmx768m

# Parallel build disabled (2026-10-03) — running multiple compile workers
# concurrently was part of what pushed total memory use over the edge on this
# machine; caching alone still keeps rebuilds fast.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
